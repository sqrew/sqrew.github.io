<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>WebGPU NIfTI 3D Brain Viewer</title>
    <style>
      body {
        margin: 0;
        background-color: #0f172a;
        color: #f1f5f9;
        font-family: 'Lucida Console', Monaco, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
        height: 100vh;
      }
      #canvas {
        border: none;
        background-color: black;
        width: 1280px;
        height: 720px;
        display: block;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      .emscripten_border {
        border: 2px solid #1e293b;
        border-radius: 12px;
        overflow: hidden;
        margin-top: 20px;
      }
      #status {
        margin-top: 10px;
        font-weight: bold;
        color: #06b6d4;
      }
      #output {
        width: 1280px;
        height: 120px;
        margin-top: 15px;
        background-color: #020617;
        color: #94a3b8;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 8px;
        font-family: monospace;
        font-size: 12px;
        resize: none;
        outline: none;
      }
      .toolbar {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        gap: 12px;
      }
      .toolbar button {
        padding: 12px 24px;
        background: rgba(15, 23, 42, 0.85);
        color: #06b6d4;
        border: 1px solid #0891b2;
        border-radius: 8px;
        font-family: 'Lucida Console', Monaco, monospace;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        backdrop-filter: blur(8px);
        box-shadow: 0 0 15px rgba(6,182,212,0.25);
        transition: all 0.2s ease;
        outline: none;
      }
      .toolbar button:hover {
        background: rgba(6, 182, 212, 0.2);
        box-shadow: 0 0 25px rgba(6, 182, 212, 0.5);
        color: #22d3ee;
        border-color: #22d3ee;
      }
      .slider-container {
        display: flex;
        justify-content: space-around;
        width: 1280px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 15px;
        margin-top: 15px;
        box-sizing: border-box;
        backdrop-filter: blur(8px);
      }
      .slider-group {
        display: flex;
        flex-direction: column;
        width: 30%;
      }
      .slider-group label {
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 6px;
        font-weight: bold;
      }
      .slider-group label span {
        color: #06b6d4;
      }
      .slider-group input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        background: #1e293b;
        height: 6px;
        border-radius: 3px;
        outline: none;
      }
      .slider-group input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #06b6d4;
        cursor: pointer;
        box-shadow: 0 0 8px rgba(6,182,212,0.8);
        transition: transform 0.1s ease;
      }
      .slider-group input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
      }
      .spinner {
        height: 30px;
        width: 30px;
        margin-top: 20px;
        border: 4px solid #1e293b;
        border-top-color: #06b6d4;
        border-radius: 50%;
        animation: rotation .8s linear infinite;
      }
      @keyframes rotation {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="load-btn">LOAD LOCAL FILE (L)</button>
      <button id="fullscreen-btn">FULLSCREEN</button>
    </div>
    <input type="file" id="nii-file-input" accept=".nii" style="display:none;" />

    <div class="spinner" id='spinner'></div>
    <div id="status">Downloading...</div>

    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>

    <div class="slider-container">
      <div class="slider-group">
        <label for="clip-x">Sagittal (X) Clip: <span id="val-x">100%</span></label>
        <input type="range" id="clip-x" min="0" max="100" value="100">
      </div>
      <div class="slider-group">
        <label for="clip-y">Coronal (Y) Clip: <span id="val-y">100%</span></label>
        <input type="range" id="clip-y" min="0" max="100" value="100">
      </div>
      <div class="slider-group">
        <label for="clip-z">Axial (Z) Clip: <span id="val-z">100%</span></label>
        <input type="range" id="clip-z" min="0" max="100" value="100">
      </div>
    </div>

    <div class="slider-container" style="margin-top: 10px;">
      <div class="slider-group" style="width: 45%;">
        <label for="min-thresh">Min Density Cutoff: <span id="val-min">22%</span></label>
        <input type="range" id="min-thresh" min="0" max="100" value="22">
      </div>
      <div class="slider-group" style="width: 45%;">
        <label for="max-thresh">Max Density Cutoff: <span id="val-max">100%</span></label>
        <input type="range" id="max-thresh" min="0" max="100" value="100">
      </div>
    </div>

    <textarea id="output" rows="8" readonly></textarea>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');

      var setStatus = (text) => {
        if (text) {
          statusElement.innerHTML = text;
          statusElement.style.display = 'block';
        } else {
          statusElement.style.display = 'none';
          spinnerElement.style.display = 'none';
        }
      };

      window.triggerNiftiFileSelect = function() {
        const input = document.getElementById('nii-file-input');
        if (input) {
          input.value = ''; // clear selection to allow reloading same file
          input.click();
        }
      };

      document.addEventListener('keydown', function(e) {
        if (e.key === 'l' || e.key === 'L') {
          window.triggerNiftiFileSelect();
        }
      });

      document.getElementById('load-btn').onclick = function() {
        window.triggerNiftiFileSelect();
      };

      document.getElementById('fullscreen-btn').onclick = function() {
        canvasElement.requestFullscreen().then(() => {
          canvasElement.requestPointerLock();
        }).catch(() => {
          canvasElement.requestFullscreen();
          canvasElement.requestPointerLock();
        });
      };

      canvasElement.ondblclick = function() {
        canvasElement.requestFullscreen().then(() => {
          canvasElement.requestPointerLock();
        }).catch(() => {
          canvasElement.requestFullscreen();
          canvasElement.requestPointerLock();
        });
      };

      document.getElementById('nii-file-input').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        console.log("[JS Loader] User selected file:", file.name, "(" + file.size + " bytes)");
        const reader = new FileReader();
        reader.onload = function(evt) {
          try {
            const arr = new Uint8Array(evt.target.result);
            const len = arr.length;
            const ptr = Module._malloc(len);
            Module.HEAPU8.set(arr, ptr);
            Module._nii_load_file_data(ptr, len);
            Module._free(ptr);
            console.log("[JS Loader] Successfully sent NIfTI data to WASM.");
          } catch(err) {
            console.error("[JS Loader] Error loading file to WASM:", err);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      function updateClip(axis, val) {
        const percent = val + "%";
        if (axis === 0) document.getElementById('val-x').innerText = percent;
        if (axis === 1) document.getElementById('val-y').innerText = percent;
        if (axis === 2) document.getElementById('val-z').innerText = percent;

        if (Module._nii_set_clipping) {
          Module._nii_set_clipping(axis, val / 100.0);
        }
      }

      document.getElementById('clip-x').oninput = function() { updateClip(0, this.value); };
      document.getElementById('clip-y').oninput = function() { updateClip(1, this.value); };
      document.getElementById('clip-z').oninput = function() { updateClip(2, this.value); };

      window.updateClippingSlider = function(axis, value) {
        const percent = Math.round(value * 100);
        if (axis === 0) {
          document.getElementById('clip-x').value = percent;
          document.getElementById('val-x').innerText = percent + "%";
        }
        if (axis === 1) {
          document.getElementById('clip-y').value = percent;
          document.getElementById('val-y').innerText = percent + "%";
        }
        if (axis === 2) {
          document.getElementById('clip-z').value = percent;
          document.getElementById('val-z').innerText = percent + "%";
        }
      };

      document.getElementById('min-thresh').oninput = function() {
        const val = this.value;
        document.getElementById('val-min').innerText = val + "%";
        if (Module._nii_set_min_threshold) {
          Module._nii_set_min_threshold(val / 100.0);
        }
      };

      document.getElementById('max-thresh').oninput = function() {
        const val = this.value;
        document.getElementById('val-max').innerText = val + "%";
        if (Module._nii_set_max_threshold) {
          Module._nii_set_max_threshold(val / 100.0);
        }
      };

      window.updateMinThresholdSlider = function(value) {
        const percent = Math.round(value * 100);
        document.getElementById('min-thresh').value = percent;
        document.getElementById('val-min').innerText = percent + "%";
      };

      var Module = {
        print(...args) {
          console.log(...args);
          if (outputElement) {
            var text = args.join(' ');
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
          }
        },
        canvas: canvasElement,
        setStatus: setStatus,
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : '');
        }
      };

      setStatus('Downloading...');
      window.onerror = window.onunhandledrejection = (err) => {
        setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
      };
    </script>
    <script async type="text/javascript" src="index.js"></script>
  </body>
</html>
