<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>WebGPU NIfTI 3D Brain Viewer</title>
    <style>
      body {
        margin: 0;
        background-color: #0f172a;
        color: #f1f5f9;
        font-family: 'Lucida Console', Monaco, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
        height: 100vh;
      }
      #canvas {
        border: none;
        background-color: black;
        width: 1280px;
        height: 720px;
        display: block;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      .emscripten_border {
        border: 2px solid #1e293b;
        border-radius: 12px;
        overflow: hidden;
        margin-top: 20px;
      }
      #status {
        margin-top: 10px;
        font-weight: bold;
        color: #06b6d4;
      }
      #output {
        width: 1280px;
        height: 120px;
        margin-top: 15px;
        background-color: #020617;
        color: #94a3b8;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 8px;
        font-family: monospace;
        font-size: 12px;
        resize: none;
        outline: none;
      }
      .toolbar {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        gap: 12px;
      }
      .toolbar button {
        padding: 12px 24px;
        background: rgba(15, 23, 42, 0.85);
        color: #06b6d4;
        border: 1px solid #0891b2;
        border-radius: 8px;
        font-family: 'Lucida Console', Monaco, monospace;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        backdrop-filter: blur(8px);
        box-shadow: 0 0 15px rgba(6,182,212,0.25);
        transition: all 0.2s ease;
        outline: none;
      }
      .toolbar button:hover {
        background: rgba(6, 182, 212, 0.2);
        box-shadow: 0 0 25px rgba(6, 182, 212, 0.5);
        color: #22d3ee;
        border-color: #22d3ee;
      }
      .spinner {
        height: 30px;
        width: 30px;
        margin-top: 20px;
        border: 4px solid #1e293b;
        border-top-color: #06b6d4;
        border-radius: 50%;
        animation: rotation .8s linear infinite;
      }
      @keyframes rotation {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="load-btn">LOAD LOCAL FILE (L)</button>
      <button id="fullscreen-btn">FULLSCREEN</button>
    </div>
    <input type="file" id="nii-file-input" accept=".nii" style="display:none;" />

    <div class="spinner" id='spinner'></div>
    <div id="status">Downloading...</div>

    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>
    <textarea id="output" rows="8" readonly></textarea>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');

      var setStatus = (text) => {
        if (text) {
          statusElement.innerHTML = text;
          statusElement.style.display = 'block';
        } else {
          statusElement.style.display = 'none';
          spinnerElement.style.display = 'none';
        }
      };

      window.triggerNiftiFileSelect = function() {
        const input = document.getElementById('nii-file-input');
        if (input) {
          input.value = ''; // clear selection to allow reloading same file
          input.click();
        }
      };

      document.addEventListener('keydown', function(e) {
        if (e.key === 'l' || e.key === 'L') {
          window.triggerNiftiFileSelect();
        }
      });

      document.getElementById('load-btn').onclick = function() {
        window.triggerNiftiFileSelect();
      };

      document.getElementById('fullscreen-btn').onclick = function() {
        if (Module.requestFullscreen) {
          Module.requestFullscreen(true, true);
        } else {
          canvasElement.requestFullscreen();
        }
      };

      canvasElement.ondblclick = function() {
        if (Module.requestFullscreen) {
          Module.requestFullscreen(true, true);
        } else {
          canvasElement.requestFullscreen();
        }
      };

      document.getElementById('nii-file-input').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        console.log("[JS Loader] User selected file:", file.name, "(" + file.size + " bytes)");
        const reader = new FileReader();
        reader.onload = function(evt) {
          try {
            const arr = new Uint8Array(evt.target.result);
            const len = arr.length;
            const ptr = Module._malloc(len);
            Module.HEAPU8.set(arr, ptr);
            Module._nii_load_file_data(ptr, len);
            Module._free(ptr);
            console.log("[JS Loader] Successfully sent NIfTI data to WASM.");
          } catch(err) {
            console.error("[JS Loader] Error loading file to WASM:", err);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      var Module = {
        print(...args) {
          console.log(...args);
          if (outputElement) {
            var text = args.join(' ');
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
          }
        },
        canvas: canvasElement,
        setStatus: setStatus,
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : '');
        }
      };

      setStatus('Downloading...');
      window.onerror = window.onunhandledrejection = (err) => {
        setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
      };
    </script>
    <script async type="text/javascript" src="index.js"></script>
  </body>
</html>
