<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>3D Magnetic Field Sandbox</title>
    <style>
      :root {
        --bg-color: #0c0e14;
        --panel-bg: #141722;
        --border-color: #212638;
        --text-primary: #f0f3fa;
        --text-secondary: #848c9f;
        --accent-red: #ff4a4a;
        --accent-blue: #4a82ff;
        --accent-teal: #00ffcc;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        background-color: var(--bg-color);
        color: var(--text-primary);
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      #app-container {
        display: flex;
        width: 100vw;
        height: 100vh;
      }
      #sidebar {
        width: 360px;
        background-color: var(--panel-bg);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow-y: auto;
      }
      .app-header {
        padding: 24px;
        border-bottom: 1px solid var(--border-color);
      }
      .app-header h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
      }
      .app-header p {
        margin: 4px 0 0 0;
        font-size: 11px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }
      .section {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border-color);
      }
      .section-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        margin-bottom: 12px;
        letter-spacing: 0.5px;
      }
      .btn-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin-bottom: 12px;
      }
      button.btn {
        background-color: #1e2230;
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 10px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      button.btn:hover {
        background-color: #2a2f42;
        border-color: #383f5c;
      }
      button.btn-primary {
        background-color: #2745cf;
        border-color: #385dfc;
      }
      button.btn-primary:hover {
        background-color: #3456e3;
      }
      .slider-group {
        margin-bottom: 16px;
      }
      .slider-header {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        margin-bottom: 6px;
      }
      .slider-header span {
        color: var(--text-secondary);
      }
      .slider-header strong {
        color: var(--text-primary);
      }
      input[type=range] {
        width: 100%;
        margin: 0;
        background: #1e2230;
        border-radius: 4px;
        height: 6px;
        -webkit-appearance: none;
        outline: none;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #385dfc;
        cursor: pointer;
      }
      .pole-card {
        background-color: #1a1d29;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .pole-card.inactive {
        display: none;
      }
      .pole-title-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-size: 13px;
        font-weight: 600;
      }
      .pole-badge {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
        text-transform: uppercase;
        font-weight: bold;
      }
      .badge-positive {
        background-color: rgba(255, 74, 74, 0.15);
        color: var(--accent-red);
      }
      .badge-negative {
        background-color: rgba(74, 130, 255, 0.15);
        color: var(--accent-blue);
      }
      #viewport-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        background-color: var(--bg-color);
      }
      .emscripten_border {
        border: 1px solid var(--border-color);
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        border-radius: 8px;
        overflow: hidden;
        background-color: black;
      }
      canvas.emscripten {
        display: block;
        border: 0 none;
        outline: none;
      }
      .status-panel {
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        background-color: rgba(20, 23, 34, 0.85);
        border: 1px solid var(--border-color);
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 13px;
        z-index: 10;
        backdrop-filter: blur(8px);
      }
      .spinner {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--text-secondary);
        border-top-color: var(--text-primary);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .help-overlay {
        margin-top: 16px;
        text-align: center;
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.6;
      }
      .help-overlay code {
        background-color: #1e2230;
        padding: 2px 4px;
        border-radius: 4px;
        color: var(--text-primary);
      }
      .console-drawer {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: #0b0c10;
        border-top: 1px solid var(--border-color);
        z-index: 100;
        transform: translateY(calc(100% - 36px));
        transition: transform 0.3s ease;
      }
      .console-drawer.open {
        transform: translateY(0);
      }
      .console-header {
        height: 36px;
        background-color: var(--panel-bg);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 16px;
        cursor: pointer;
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 600;
      }
      #output {
        width: 100%;
        height: 180px;
        background-color: #07080a;
        color: #00ff66;
        border: none;
        padding: 12px;
        font-family: monospace;
        font-size: 11px;
        resize: none;
        outline: none;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="app-container">
      <div id="sidebar">
        <div class="app-header">
          <h1>Magnetic Sandbox 3D</h1>
          <p>WebGPU & Carp Engine</p>
        </div>

        <div class="section">
          <div class="section-title">Presets</div>
          <div class="btn-grid">
            <button class="btn" onclick="applyPreset('dipole')">Dipole</button>
            <button class="btn" onclick="applyPreset('quadrupole')">Quadrupole</button>
            <button class="btn" onclick="applyPreset('halbach')">Halbach-like</button>
            <button class="btn" onclick="triggerRandomize()">Randomize</button>
          </div>
          <button class="btn btn-primary" style="width: 100%;" onclick="triggerReset()">Reset Workspace</button>
        </div>

        <div class="section">
          <div class="section-title">Configuration</div>
          <div class="slider-group">
            <div class="slider-header">
              <span>Active Poles</span>
              <strong id="active-count-val">8</strong>
            </div>
            <input type="range" id="active-count-slider" min="1" max="8" value="8" step="1" oninput="onActiveCountChange(this.value)">
          </div>
        </div>

        <div class="section" id="poles-container" style="flex: 1; border-bottom: none;">
          <div class="section-title">Poles Editor</div>
          <!-- Dynamic Pole Cards will be rendered here -->
        </div>
      </div>

      <div id="viewport-container">
        <div class="status-panel" id="status-panel">
          <div class="spinner" id="spinner"></div>
          <span id="status">Loading WASM and WebGPU...</span>
          <progress id="progress" hidden></progress>
        </div>

        <div class="emscripten_border">
          <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" width="800" height="600" tabindex="-1"></canvas>
        </div>

        <div class="help-overlay">
          <code>Right Click + Drag</code> Orbit Camera &nbsp;|&nbsp; 
          <code>Left Click + Drag</code> Move Poles in Plane &nbsp;|&nbsp; 
          <code>Shift + Drag</code> Adjust Height (Z-axis)
        </div>

        <div class="console-drawer" id="console-drawer">
          <div class="console-header" onclick="toggleConsole()">
            <span>DEBUG CONSOLE LOG</span>
            <span id="console-toggle-indicator">▲ Show</span>
          </div>
          <textarea id="output" readonly></textarea>
        </div>
      </div>
    </div>

    <script type="text/javascript">
      // 1. Initial State Definition (accessed by WebAssembly kernel)
      window.magneticViewerState = {
        activeCount: 8,
        yaw: 0.0,
        pitch: 0.2,
        resetRequested: false,
        randomizeRequested: false,
        poles: [
          { x: 0.25, y: 0.35, z: 0.50, charge: 1.0 },
          { x: 0.35, y: 0.45, z: 0.50, charge: -1.0 },
          { x: 0.45, y: 0.35, z: 0.50, charge: 1.0 },
          { x: 0.55, y: 0.65, z: 0.50, charge: -1.0 },
          { x: 0.65, y: 0.55, z: 0.50, charge: 1.0 },
          { x: 0.75, y: 0.65, z: 0.50, charge: -1.0 },
          { x: 0.30, y: 0.70, z: 0.50, charge: 1.0 },
          { x: 0.70, y: 0.30, z: 0.50, charge: -1.0 }
        ]
      };

      // 2. UI Rendering Logic
      function renderPolesEditor() {
        const container = document.getElementById('poles-container');
        container.innerHTML = '<div class="section-title">Poles Editor</div>';
        
        for (let i = 0; i < 8; i++) {
          const pole = window.magneticViewerState.poles[i];
          const isInactive = i >= window.magneticViewerState.activeCount;
          
          const card = document.createElement('div');
          card.className = `pole-card ${isInactive ? 'inactive' : ''}`;
          card.id = `pole-card-${i}`;
          
          const isPos = pole.charge >= 0;
          const badgeClass = isPos ? 'badge-positive' : 'badge-negative';
          const badgeText = isPos ? 'North (+)' : 'South (-)';
          
          card.innerHTML = `
            <div class="pole-title-bar">
              <span>Pole ${i + 1}</span>
              <span class="pole-badge ${badgeClass}" id="pole-badge-${i}">${badgeText}</span>
            </div>
            
            <div class="slider-group">
              <div class="slider-header">
                <span>Charge Strength</span>
                <strong id="pole-charge-val-${i}">${pole.charge.toFixed(2)}</strong>
              </div>
              <input type="range" id="pole-charge-slider-${i}" min="-1" max="1" value="${pole.charge}" step="0.05" oninput="onPoleChargeChange(${i}, this.value)">
            </div>
            
            <div class="slider-group" style="margin-bottom: 8px;">
              <div class="slider-header">
                <span>Position X</span>
                <strong id="pole-x-val-${i}">${pole.x.toFixed(2)}</strong>
              </div>
              <input type="range" id="pole-x-slider-${i}" min="0" max="1" value="${pole.x}" step="0.01" oninput="onPolePosChange(${i}, 'x', this.value)">
            </div>

            <div class="slider-group" style="margin-bottom: 8px;">
              <div class="slider-header">
                <span>Position Y</span>
                <strong id="pole-y-val-${i}">${pole.y.toFixed(2)}</strong>
              </div>
              <input type="range" id="pole-y-slider-${i}" min="0" max="1" value="${pole.y}" step="0.01" oninput="onPolePosChange(${i}, 'y', this.value)">
            </div>

            <div class="slider-group" style="margin-bottom: 0;">
              <div class="slider-header">
                <span>Position Z (Height)</span>
                <strong id="pole-z-val-${i}">${pole.z.toFixed(2)}</strong>
              </div>
              <input type="range" id="pole-z-slider-${i}" min="0" max="1" value="${pole.z}" step="0.01" oninput="onPolePosChange(${i}, 'z', this.value)">
            </div>
          `;
          
          container.appendChild(card);
        }
      }

      function updateSlidersFromState() {
        // Update active count slider
        document.getElementById('active-count-slider').value = window.magneticViewerState.activeCount;
        document.getElementById('active-count-val').innerText = window.magneticViewerState.activeCount;
        
        for (let i = 0; i < 8; i++) {
          const pole = window.magneticViewerState.poles[i];
          const card = document.getElementById(`pole-card-${i}`);
          
          if (card) {
            if (i < window.magneticViewerState.activeCount) {
              card.classList.remove('inactive');
            } else {
              card.classList.add('inactive');
            }
            
            // Update values
            document.getElementById(`pole-charge-slider-${i}`).value = pole.charge;
            document.getElementById(`pole-charge-val-${i}`).innerText = pole.charge.toFixed(2);
            
            document.getElementById(`pole-x-slider-${i}`).value = pole.x;
            document.getElementById(`pole-x-val-${i}`).innerText = pole.x.toFixed(2);
            
            document.getElementById(`pole-y-slider-${i}`).value = pole.y;
            document.getElementById(`pole-y-val-${i}`).innerText = pole.y.toFixed(2);
            
            document.getElementById(`pole-z-slider-${i}`).value = pole.z;
            document.getElementById(`pole-z-val-${i}`).innerText = pole.z.toFixed(2);
            
            // Update badge colors
            const badge = document.getElementById(`pole-badge-${i}`);
            const isPos = pole.charge >= 0;
            badge.className = `pole-badge ${isPos ? 'badge-positive' : 'badge-negative'}`;
            badge.innerText = isPos ? 'North (+)' : 'South (-)';
          }
        }
      }

      // 3. Sync events from WASM
      window.onMagneticViewerStateChanged = function() {
        updateSlidersFromState();
        updateUrlHash();
      };

      // 4. Input Handlers
      function onActiveCountChange(val) {
        window.magneticViewerState.activeCount = parseInt(val);
        document.getElementById('active-count-val').innerText = val;
        // Show/hide cards
        for (let i = 0; i < 8; i++) {
          const card = document.getElementById(`pole-card-${i}`);
          if (card) {
            if (i < window.magneticViewerState.activeCount) {
              card.classList.remove('inactive');
            } else {
              card.classList.add('inactive');
            }
          }
        }
        updateUrlHash();
      }

      function onPoleChargeChange(idx, val) {
        const floatVal = parseFloat(val);
        window.magneticViewerState.poles[idx].charge = floatVal;
        document.getElementById(`pole-charge-val-${idx}`).innerText = floatVal.toFixed(2);
        
        const badge = document.getElementById(`pole-badge-${idx}`);
        const isPos = floatVal >= 0;
        badge.className = `pole-badge ${isPos ? 'badge-positive' : 'badge-negative'}`;
        badge.innerText = isPos ? 'North (+)' : 'South (-)';
        updateUrlHash();
      }

      function onPolePosChange(idx, axis, val) {
        const floatVal = parseFloat(val);
        window.magneticViewerState.poles[idx][axis] = floatVal;
        document.getElementById(`pole-${axis}-val-${idx}`).innerText = floatVal.toFixed(2);
        updateUrlHash();
      }

      function triggerReset() {
        window.magneticViewerState.resetRequested = true;
        history.replaceState(null, null, ' ');
      }

      function triggerRandomize() {
        window.magneticViewerState.randomizeRequested = true;
      }

      // Helper function to set values preventing division by zero / singularities
      function setPoleSafely(idx, x, y, z, charge) {
        window.magneticViewerState.poles[idx] = {
          x: Math.max(0.01, Math.min(0.99, x)),
          y: Math.max(0.01, Math.min(0.99, y)),
          z: Math.max(0.01, Math.min(0.99, z)),
          charge: charge
        };
      }

      function applyPreset(name) {
        if (name === 'dipole') {
          window.magneticViewerState.activeCount = 2;
          setPoleSafely(0, 0.35, 0.50, 0.50, 1.0);
          setPoleSafely(1, 0.65, 0.50, 0.50, -1.0);
        } else if (name === 'quadrupole') {
          window.magneticViewerState.activeCount = 4;
          setPoleSafely(0, 0.35, 0.35, 0.50, 1.0);
          setPoleSafely(1, 0.65, 0.35, 0.50, -1.0);
          setPoleSafely(2, 0.65, 0.65, 0.50, 1.0);
          setPoleSafely(3, 0.35, 0.65, 0.50, -1.0);
        } else if (name === 'halbach') {
          window.magneticViewerState.activeCount = 5;
          setPoleSafely(0, 0.20, 0.50, 0.50, 1.0);
          setPoleSafely(1, 0.35, 0.50, 0.50, -1.0);
          setPoleSafely(2, 0.50, 0.50, 0.50, 1.0);
          setPoleSafely(3, 0.65, 0.50, 0.50, -1.0);
          setPoleSafely(4, 0.80, 0.50, 0.50, 1.0);
        }
        
        window.magneticViewerState.yaw = 0.0;
        window.magneticViewerState.pitch = 0.2;
        updateSlidersFromState();
        updateUrlHash();
      }

      // Hash Serialization Logic
      function updateUrlHash() {
        const state = window.magneticViewerState;
        const parts = [];
        parts.push(`c=${state.activeCount}`);
        parts.push(`y=${state.yaw.toFixed(2)}`);
        parts.push(`p=${state.pitch.toFixed(2)}`);
        const poleStrings = [];
        for (let i = 0; i < state.activeCount; i++) {
          const p = state.poles[i];
          poleStrings.push(`${p.x.toFixed(2)},${p.y.toFixed(2)},${p.z.toFixed(2)},${p.charge.toFixed(2)}`);
        }
        parts.push(`poles=${poleStrings.join(';')}`);
        
        const newHash = '#' + parts.join('&');
        if (window.location.hash !== newHash) {
          history.replaceState(null, null, newHash);
        }
      }

      function loadStateFromUrl() {
        const hash = window.location.hash;
        if (!hash || hash.length < 2) return;
        
        const searchParams = new URLSearchParams(hash.substring(1));
        
        if (searchParams.has('c')) {
          window.magneticViewerState.activeCount = parseInt(searchParams.get('c'));
        }
        if (searchParams.has('y')) {
          window.magneticViewerState.yaw = parseFloat(searchParams.get('y'));
        }
        if (searchParams.has('p')) {
          window.magneticViewerState.pitch = parseFloat(searchParams.get('p'));
        }
        if (searchParams.has('poles')) {
          const poleStrings = searchParams.get('poles').split(';');
          for (let i = 0; i < poleStrings.length; i++) {
            if (i >= 8) break;
            const parts = poleStrings[i].split(',');
            if (parts.length === 4) {
              window.magneticViewerState.poles[i] = {
                x: parseFloat(parts[0]),
                y: parseFloat(parts[1]),
                z: parseFloat(parts[2]),
                charge: parseFloat(parts[3])
              };
            }
          }
        }
      }

      // Initialize UI cards
      loadStateFromUrl();
      renderPolesEditor();
      updateSlidersFromState();

      // Console Toggle helper
      function toggleConsole() {
        const drawer = document.getElementById('console-drawer');
        const indicator = document.getElementById('console-toggle-indicator');
        if (drawer.classList.contains('open')) {
          drawer.classList.remove('open');
          indicator.innerText = '▲ Show';
        } else {
          drawer.classList.add('open');
          indicator.innerText = '▼ Hide';
        }
      }

      // 5. Emscripten Loader Interface
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');
      if (outputElement) outputElement.value = '';

      var setStatus = (text) => {
        if (!setStatus.last) setStatus.last = { time: Date.now(), text: '' };
        if (text === setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - setStatus.last.time < 30) return;
        setStatus.last.time = now;
        setStatus.last.text = text;
        if (m) {
          text = m[1];
          progressElement.value = parseInt(m[2])*100;
          progressElement.max = parseInt(m[4])*100;
          progressElement.hidden = false;
          spinnerElement.style.display = 'inline-block';
        } else {
          progressElement.value = null;
          progressElement.max = null;
          progressElement.hidden = true;
          if (!text) {
            document.getElementById('status-panel').style.display = 'none';
          }
        }
        statusElement.innerHTML = text;
      };

      var Module = {
        print(...args) {
          console.log(...args);
          if (outputElement) {
            var text = args.join(' ');
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
          }
        },
        canvas: canvasElement,
        setStatus: setStatus,
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      setStatus('Downloading WebAssembly binary...');
      window.onerror = window.onunhandledrejection = (err) => {
        setStatus('Exception thrown, see developer console');
        spinnerElement.style.display = 'none';
        console.error(err);
      };
    </script>
    <script async type="text/javascript" src="index.js"></script>
  </body>
</html>
